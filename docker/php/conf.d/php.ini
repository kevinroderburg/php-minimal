[PHP]

; Fehler sichtbar machen (nur Entwicklung!)
display_errors = On
display_startup_errors = On

error_reporting = E_ALL

; Zeitzone
date.timezone = Europe/Berlin

; Speicher
memory_limit = 512M

; Uploads
upload_max_filesize = 50M
post_max_size = 50M

; Performance
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0